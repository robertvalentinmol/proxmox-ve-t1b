<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{NOMBRE}} · {{IP}}</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='16' fill='%23{{C1}}'/%3E%3Ctext x='16' y='22' font-size='17' font-family='sans-serif' font-weight='700' fill='white' text-anchor='middle'%3E{{NUM}}%3C/text%3E%3C/svg%3E">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{min-height:100vh;display:grid;place-items:center;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Ubuntu,sans-serif;
       background:radial-gradient(circle at 20% 15%,#{{C2}} 0,transparent 55%),linear-gradient(135deg,#{{C1}},#{{C3}});color:#14161c}
  .card{background:#fff;border-radius:24px;padding:40px 48px;width:min(520px,90vw);box-shadow:0 30px 70px rgba(0,0,0,.25);text-align:center;animation:in .6s cubic-bezier(.2,.8,.2,1)}
  @keyframes in{from{opacity:0;transform:translateY(20px) scale(.97)}}
  .num{width:84px;height:84px;margin:0 auto 18px;border-radius:24px;display:grid;place-items:center;font-size:44px;font-weight:800;color:#fff;
       background:linear-gradient(135deg,#{{C1}},#{{C3}});box-shadow:0 12px 26px rgba(0,0,0,.18)}
  h1{font-size:40px;letter-spacing:-1px;margin-bottom:6px}
  p.sub{color:#6a7180;margin-bottom:24px}
  .ok{display:inline-flex;align-items:center;gap:8px;background:#eafaf1;color:#0d7a43;font-weight:600;font-size:14px;padding:6px 14px;border-radius:999px;margin-bottom:26px}
  .ok i{width:8px;height:8px;border-radius:50%;background:#12a15a;box-shadow:0 0 0 4px rgba(18,161,90,.18)}
  dl{display:grid;grid-template-columns:1fr 1fr;gap:12px;text-align:left}
  dl div{background:#f4f5f8;border-radius:14px;padding:12px 16px}
  dt{font-size:12px;color:#6a7180;text-transform:uppercase;letter-spacing:1px}
  dd{font-size:17px;font-weight:650;font-family:ui-monospace,"DejaVu Sans Mono",Consolas,monospace;margin-top:2px}
  footer{margin-top:24px;font-size:12.5px;color:#9097a3}
</style>
</head>
<body>
  <main class="card">
    <div class="num">{{NUM}}</div>
<h1>Hola desde {{NOMBRE}}</h1>
    <p class="sub">Servidor web desplegado automáticamente</p>
    <div class="ok"><i></i>En línea · nginx</div>
    <dl>
      <div><dt>Dirección IP</dt><dd>{{IP}}</dd></div>
      <div><dt>Contenedor</dt><dd>CT {{CT}}</dd></div>
      <div><dt>Clonado de</dt><dd>Plantilla 900</dd></div>
      <div><dt>Creado a las</dt><dd>{{HORA}}</dd></div>
    </dl>
    <footer>Proxmox VE · clon enlazado · Grupo T1B</footer>
  </main>
</body>
</html>
